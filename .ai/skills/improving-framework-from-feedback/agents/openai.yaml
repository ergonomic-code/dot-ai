interface:
  display_name: "Improving framework from feedback"
  short_description: "Convert model fix-up commits into framework patches"
  default_prompt: >
    Given PROJECT_DIR, MODEL, PROMPT, RESULT_COMMIT, and FIX_COMMITS (and optionally FINAL_COMMIT and PATCH_MODE), analyze diffs and commit messages, cluster failure modes, resolve the framework root and <project-local> using AGENTS.md and bootstrap/AGENTS.md, and patch the actual enforcing artifacts under `<framework>/...` and/or `<project-local>/...`.
    If PATCH_MODE is missing, resolve both the framework checkout inside PROJECT_DIR and the framework checkout you are currently editing.
    If both resolve and differ, ask which checkout to patch instead of guessing.
    If the PROJECT_DIR checkout is missing or both roots resolve to the same filesystem path, use framework-repo.
    Otherwise use consumer-project.
    In framework materials, keep project-local references written as `<project-local>/...`.
    Keep changes minimal and generalizable, and add a lightweight regression hook.
